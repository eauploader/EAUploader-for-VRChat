# VPMパッケージを作成してリリースへ添付し、VPMレジストリ (registry.json) をGitHub Pagesへ公開する。
#
# 失敗したときの再実行について:
#   リリースから起動した実行を「Re-run」すると、タグ時点の古いワークフローで動く。
#   修正後のワークフローで再実行するには、Actions画面の「Run workflow」から
#   main (またはbeta) を選び、リリースタグを指定して実行する。
#   zipは一度リリースへ添付したら作り直さないため、何度再実行しても同じzipとハッシュが使われる。
name: VPMレジストリを更新

on:
    release:
        types:
            - published
    workflow_dispatch:
        inputs:
            releasedTagName:
                description: 追加するリリースタグ (「v」を前置したバージョン番号)。空欄ならレジストリの再生成のみ
                type: string
                required: false

# 公開中の registry.json を元に更新するため、同時に実行しない
concurrency:
    group: vpm-registry
    cancel-in-progress: false

jobs:
    build:
        timeout-minutes: 30
        permissions:
            contents: write
        runs-on: ubuntu-24.04
        env:
            TAG_NAME: ${{ inputs.releasedTagName || github.event.release.tag_name }}
        steps:
            - name: ワークフローのブランチをチェックアウト
              uses: actions/checkout@v5

            - name: リリースタグのパッケージをチェックアウト
              if: ${{ env.TAG_NAME != '' }}
              uses: actions/checkout@v5
              with:
                ref: refs/tags/${{ env.TAG_NAME }}
                path: package-source

            - uses: actions/setup-node@v5
              with:
                node-version: '24'
                cache: npm
                cache-dependency-path: .vpm/package-lock.json

            - run: npm --prefix ./.vpm/ ci

            - name: VPMパッケージを作成してレジストリを生成
              run: npm --prefix ./.vpm/ run build
              env:
                GH_TOKEN: ${{ github.token }}
                PACKAGE_SOURCE_PATH: ${{ github.workspace }}/package-source

            - name: GitHub Pages用のデータをアップロード
              uses: actions/upload-pages-artifact@v4
              with:
                path: ./.vpm/site/

    deploy:
        needs: build
        timeout-minutes: 15
        permissions:
            pages: write
            id-token: write
        runs-on: ubuntu-24.04
        steps:
            - name: Deploy to GitHub Pages
              uses: actions/deploy-pages@v4
              with:
                timeout: 600000
